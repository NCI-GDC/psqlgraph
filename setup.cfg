[metadata]
name = psqlgraph
description = postgresql graph library
long_description = file: README.md
long_description_content_type = text/markdown
author = Gdc feature team
author_email = gdc_dev_questions-aaaaae2lhsbell56tlvh3upgoq@cdis.slack.com
maintainer = GDC Feature Team
maintainer_email = gdc_dev_questions-aaaaae2lhsbell56tlvh3upgoq@cdis.slack.com
license = Apache Software License 2.0
license_files = LICENSE
url = https://github.com/NCI-GDC/psqlgraph
keywords = psqlgraph, sqlalchemy, Genomic Data Commons, graph databases
classifiers =
    License :: OSI Approved :: Apache Software License
    Operating System :: Unix
    Operating System :: POSIX :: Linux
    Topic :: Internet
    Topic :: Software Development :: Libraries :: Python Modules
    Programming Language :: Python
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Development Status   :: 5 - Production/Stable

[options]
zip_safe = True
packages = find:
package_dir =
    =src
python_requires = >=3.9,<3.12
include_package_data = True
install_requires =
    psycopg2
    sqlalchemy>=1.3,<1.4
    xlocal
    rstr


[options.packages.find]
where = src

[options.extras_require]
dev =
    coverage[toml]
    pytest
    pytest-cov>=2.7.1
lint =
    mypy
    pre-commit
psqlgraph_test_utils =
